name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/Twig.exe
          generate_release_notes: true
          body: |
            **Twig.exe** — single native executable, no runtime required.
